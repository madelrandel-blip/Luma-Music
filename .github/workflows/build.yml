name: Build

# Push to main -> just builds, so every commit gets verified.
# Push a tag like v4.0.1 -> builds AND publishes a GitHub Release with the
# Windows installer/portable ZIP attached (same flow CODESIGN.md describes).
# workflow_dispatch -> lets you trigger a build by hand from the Actions tab.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed so the release job below can create a GitHub Release and attach files to it.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (MSI + portable ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles Gradle's dependency/build cache automatically - no extra cache step needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reads the version from composeApp/build.gradle.kts (same source build-release.bat
      # uses locally), but prefers the pushed tag's version when this run came from one -
      # so `git tag v4.1.0` always produces files named for 4.1.0 even if someone forgets
      # to bump packageVersion in the same commit.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content composeApp/build.gradle.kts -Raw
          if ($content -notmatch 'packageVersion\s*=\s*"([^"]+)"') {
            throw "Could not find packageVersion in composeApp/build.gradle.kts"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          }
          Write-Host "Building version $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build distributable app image + MSI
        run: ./gradlew.bat :composeApp:createDistributable :composeApp:packageMsi --no-daemon

      # Mirrors what build-release.bat does locally: zip the plain app-image folder into a
      # portable build that doesn't need the installer.
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $distDir = "composeApp/build/compose/binaries/main/app/LumaMusic"
          if (-not (Test-Path $distDir)) { throw "Expected build output not found at $distDir" }
          Compress-Archive -Path $distDir -DestinationPath "LumaMusic-v$version-windows-portable.zip" -CompressionLevel Optimal

      - name: Locate and rename the MSI
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No .msi was produced under composeApp/build/compose/binaries/main/msi" }
          Copy-Item $msi.FullName "LumaMusic-v$version-windows.msi"

      # -----------------------------------------------------------------------
      # Code signing (Necessary Code Signing - https://sign.necessary.nu)
      #
      # CODESIGN.md describes the intended flow: on a tagged release, the MSI
      # (and the exe inside the portable ZIP) get signed via Necessary Code
      # Signing's API using the `SIGNING_TOKEN` repository secret, before
      # they're attached to the GitHub Release.
      #
      # I couldn't find published API docs for this service to wire up a real
      # call here safely - it's a small/independent free signing service, and
      # guessing at request shapes risks silently producing broken artifacts.
      # Once you have their API details (or a GitHub Action they publish),
      # replace this step's `run:` with the real call and delete `if: false`.
      # Until then, the release below ships the *unsigned* MSI/ZIP - they
      # still install and run fine, they'll just still trigger the Windows
      # SmartScreen warning this whole setup exists to avoid.
      # -----------------------------------------------------------------------
      - name: Sign Windows binaries (TODO - fill in Necessary Code Signing API call)
        if: false && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNING_TOKEN }}
        run: |
          echo "Not implemented yet - see the comment above this step."
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            LumaMusic-v*-windows-portable.zip
            LumaMusic-v*-windows.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LumaMusic-v*-windows-portable.zip
            LumaMusic-v*-windows.msi

  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles Gradle's dependency/build cache automatically - no extra cache step needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same idea as the Windows job's "Resolve version" step, just in bash: read
      # packageVersion from composeApp/build.gradle.kts, but prefer the pushed tag's version
      # when this run came from one.
      - name: Resolve version
        id: version
        run: |
          version=$(grep -oP 'packageVersion\s*=\s*"\K[^"]+' composeApp/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "Could not find packageVersion in composeApp/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Building version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same task the Windows job uses (createDistributable) - on Linux this produces a
      # jpackage app-image: a runnable folder with a native launcher at
      # LumaMusic/bin/LumaMusic, its jars, and a bundled JRE. No separate Linux-only Gradle
      # task is needed for this part.
      - name: Build distributable app image
        run: ./gradlew :composeApp:createDistributable --no-daemon

      # AppImage isn't something jpackage knows how to produce directly (on Linux it only
      # knows deb/rpm), so there's no `packageAppImage` Gradle task to call. Instead: wrap the
      # app-image folder jpackage already built into the minimal directory layout the AppImage
      # spec requires - an AppRun launcher script, a .desktop file, and an icon, all at the
      # AppDir root - then let appimagetool below bundle that into a single-file .AppImage.
      - name: Assemble AppDir
        run: |
          set -e
          DIST="composeApp/build/compose/binaries/main/app/LumaMusic"
          if [ ! -d "$DIST" ]; then
            echo "Expected build output not found at $DIST" >&2
            exit 1
          fi

          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -r "$DIST" "$APPDIR/lumamusic"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/lumamusic/bin/LumaMusic" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/lumamusic.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Luma Music
          Comment=Luma Music - YouTube Music desktop client
          Exec=AppRun
          Icon=lumamusic
          Categories=Audio;Music;Player;
          Terminal=false
          EOF

          cp composeApp/src/desktopMain/resources/icon.png "$APPDIR/lumamusic.png"

      # appimagetool is itself distributed as an AppImage. GitHub's Ubuntu runners don't have
      # FUSE set up for unprivileged AppImage mounting, so `--appimage-extract-and-run` is used
      # here (a flag every AppImage's runtime understands) to make it extract itself and run
      # without needing FUSE, instead of installing libfuse2 just for this one step.
      - name: Build AppImage
        run: |
          set -e
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          version="${{ steps.version.outputs.version }}"
          ./appimagetool --appimage-extract-and-run AppDir "LumaMusic-v${version}-linux-x86_64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: LumaMusic-v*-linux-x86_64.AppImage

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: LumaMusic-v*-linux-x86_64.AppImage

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    # `android/` is its own independent Gradle project (own settings.gradle.kts, gradlew,
    # version catalog) - nested inside this repo rather than merged into the root build, so it
    # can't clash with the desktop project's own Kotlin/Compose versions and dependencies.
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the Android SDK platform/build-tools this project needs (compileSdk/targetSdk
      # 36) and accepts the SDK licenses non-interactively. Does NOT request the deprecated
      # "tools" package (android-actions/setup-android@v3 installs it by default and that
      # package no longer exists in current command-line tools) - only the specific
      # platform-tools/platform/build-tools packages this project actually needs.
      #
      # IMPORTANT: `packages` must be space-separated on one line (its own default is
      # 'tools platform-tools', space-separated) - it's passed straight through to
      # `sdkmanager` as a single argument, not split on newlines. An earlier version of this
      # step used a YAML `|` block (one package per line), which kept the literal newlines and
      # made sdkmanager treat "platform-tools\nplatforms;android-36\nbuild-tools;36.0.0" as one
      # (nonexistent) package name - exactly the failure this run hit.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # Builds every ABI in one APK (the "universal" flavor) rather than the per-ABI splits,
      # simplest to install/sideload while this is still a debug build. Discord's proprietary
      # Social SDK (native/CMake) is skipped automatically since libs/discord_partner_sdk.aar
      # isn't committed to the repo - app/build.gradle.kts gates that build step on the file's
      # presence, so no NDK setup is needed here.
      #
      # This is a *debug*-signed build (debug keystore auto-generated by AGP) - fine for
      # sideloading/testing, not for a Play Store release. LASTFM_API_KEY, TOGETHER_BEARER_TOKEN
      # and DISCORD_SOCIAL_SDK_CLIENT_ID are optional build-time secrets (add them as repo
      # secrets and pass via env: here if/when you want those integrations enabled); left unset,
      # the app just runs with those specific features inactive.
      - name: Build debug APK
        run: ./gradlew :app:assembleUniversalDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/apk/universal/debug/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/universal/debug/*.apk
